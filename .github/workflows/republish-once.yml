name: Republish build 41422235321

# One-shot: publishes the APK that run 41422235321 already produced as a
# release asset, so it downloads as a plain .apk instead of a login-gated zip.
# Nothing is rebuilt. Delete this file once the release exists.

on:
  push:
    branches:
      - 'claude/vortexgram-13'

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download the APK from that run
        uses: actions/download-artifact@v4
        with:
          name: Release APK
          run-id: 41422235321
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find apk -type f -exec ls -la {} \;
          APK=$(find apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "No APK in that artifact" >&2; exit 1; fi
          TAG=vortexgram-13.1.1
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1 \
            && gh release delete "$TAG" --repo "${{ github.repository }}" --yes
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --title "VortexGram 13.1.1" \
            --notes "Telegram 13.1.1 base. Ad removal, archived chats, bulk media download, background transfers, Hebrew settings. Separate install from the older VortexGram - sign in once."
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].url'
