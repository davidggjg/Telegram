name: Compile check

# Fast feedback on every push: compiles all Java sources for the real release
# variant. Deliberately does NOT build the NDK code or an APK, so a work in
# progress push never produces something that looks installable.
on:
  push:
    branches:
      - 'claude/**'
  workflow_dispatch:

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 13.1.1 moved two Java modules into submodules, and settings.gradle
      # fails without them. Only these two are needed to compile Java; the jni
      # submodules matter solely for the native build.
      - name: Fetch the Java submodules
        run: |
          git submodule update --init --depth 1 \
            TMessagesProj_Modules/media \
            TMessagesProj/lib/jlatexmath

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Compile Java (no NDK, no APK)
        run: ./gradlew :TMessagesProj_App:compileAfatReleaseJavaWithJavac --no-daemon --stacktrace
