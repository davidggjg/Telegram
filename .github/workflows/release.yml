name: Build release APK

# Manual only. Pushes are checked by compile.yml instead, so work in progress
# does not spend half an hour producing an APK nobody asked for.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      # The native build needs every submodule, and since 13.1.1 two Java
      # modules live in submodules too - settings.gradle fails without them.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update packages
        run: sudo apt-get update

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      # android-actions/setup-android fails on current runners: it tries to
      # install the long-obsolete 'tools' package and aborts before Gradle runs.
      # The runner image already ships an Android SDK, so use it directly.
      - name: Setup Android SDK Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare Environment
        run: |
          echo "Removing large packages"
          sudo apt-get update
          sudo apt-get remove -y '^llvm-.*'
          sudo apt-get remove -y 'php.*'
          sudo apt-get remove -y '^mongodb-.*'
          sudo apt-get remove -y '^mysql-.*'
          sudo apt-get remove -y azure-cli firefox mono-devel libgl1-mesa-dri
          sudo apt-get autoremove -y
          sudo apt-get clean

          echo "Removing large directories"
          sudo rm -rf /usr/share/dotnet/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          df -h

          sudo apt-get install bison gcc make curl ninja-build ccache -y

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease

      # A workflow artifact downloads as a zip and needs a GitHub login, which
      # does not work on a phone. A release asset is a plain .apk.
      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          TAG="vortexgram-${{ github.run_number }}"
          gh release create "$TAG" "$APK" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "VortexGram $TAG" \
            --notes "Telegram 13.1.1 base. Built from ${{ github.ref_name }} at ${{ github.sha }}."

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
